name: Create repo diagram

# Run only manually, from the Actions tab (to update diagram: Actions tab → click on "Create repo diagram" workflow in the left sidebar → click "Run workflow" dropdown on right then green "Run workflow" button)
on:
  workflow_dispatch:

# The action needs write access to push the diagram commit
permissions:
  contents: write

jobs:
  diagram:
    runs-on: ubuntu-latest
    steps:
    
      # Pull a copy of the repo onto GitHub's runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Build the SVG and push it to a separate "diagram" branch (created automatically)
      - name: Update diagram
        uses: githubocto/repo-visualizer@0.7.1
        with:
          output_file: "diagram.svg"
          branch: "diagram"
          commit_message: "Repo visualizer: updated diagram [skip ci]"
          
          # Folders to exclude from diagram
          excluded_paths: ".git,.github,.Rproj.user"
          
          # Files to exclude from diagram (**/.DS_Store = all .DS_Store files in all subfolders)
          excluded_globs: ".gitattributes;.gitignore;**/.DS_Store"
